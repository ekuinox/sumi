name: ci

# 各 push と PR で fmt-check / clippy / test (= just validate) を回す。
# Windows 専用クレート (windows / wgpu の DirectX バックエンド) があるので
# runner は windows-latest 固定。
on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml に書いた channel (1.95.0) が cargo 初回実行で
      # rustup により自動 install される。
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # just は mise.toml で固定。release ワークフローと同じく mise 経由で揃える。
      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: just validate
        run: just validate

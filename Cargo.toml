[package]
name = "sumi"
version = "0.1.0"
edition = "2021"
description = "Windows realtime audio visualizer (WASAPI + wgpu + WGSL)."
license = "MIT"
authors = ["ekuinox"]

[[bin]]
name = "sumi"
path = "src/main.rs"

# cargo-wix (MSI installer generator) 用メタデータ。
# GUID は固定値: upgrade-guid は同一製品の upgrade 判定、path-guid は
# install 先ディレクトリの Component GUID として使われる。
# 一度公開した値は壊さない (= 後方互換のため変更しない)。
[package.metadata.wix]
upgrade-guid = "BEBB068A-3AD9-4B01-BE6B-50960FB5C607"
path-guid    = "B9F65C78-AC3E-4D21-A650-963A2AC57F6F"
license      = false
eula         = false

[dependencies]
anyhow = { version = "1.0.80", features = ["backtrace"] }
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4.5.1", features = ["derive"] }
dirs = "5"
log = "0.4.20"
notify = "6"
pollster = "0.3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
spectrum-analyzer = "1.5.0"
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tray-icon = "0.24"
wgpu = "22"
winit = "0.30"
windows = { version = "0.53.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# Examples で参照する旧依存。本体には不要なので dev-dependencies に寄せたいが、
# examples 自体は cargo の都合で通常 [dependencies] を見るのでそのまま残す。
[dev-dependencies]

# build.rs 用。コミットハッシュ + ビルド時刻を `cargo:rustc-env` で埋め込むのに使う。
# default-features を切って必要最小限 (std + clock) だけ取り込む。
[build-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

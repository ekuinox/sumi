[package]
name = "chryth"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chryth"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.80", features = ["backtrace"] }
bytemuck = { version = "1.16", features = ["derive"] }
clap = { version = "4.5.1", features = ["derive"] }
dirs = "5"
env_logger = "0.11.2"
log = "0.4.20"
notify = "6"
pollster = "0.3"
serde = { version = "1", features = ["derive"] }
spectrum-analyzer = "1.5.0"
toml = "0.8"
tray-icon = "0.24"
wgpu = "22"
winit = "0.30"
windows = { version = "0.53.0", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

# Examples で参照する旧依存。本体には不要なので dev-dependencies に寄せたいが、
# examples 自体は cargo の都合で通常 [dependencies] を見るのでそのまま残す。
[dev-dependencies]
